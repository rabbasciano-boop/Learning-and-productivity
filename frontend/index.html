<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie attività</title>
<link rel="stylesheet" href="style.css">
<script>
try { const t = localStorage.getItem("tema"); if (t === "chiaro" || t === "scuro") document.documentElement.dataset.tema = t; } catch (e) {}
</script>
</head>
<body>
<header class="testata"><div>
  <h1>Le mie attività</h1>
  <button id="tema" class="tema" type="button"></button>
</div></header>

<main>
  <section class="pannello nuova" id="sezione-nuova">
    <h2>Nuova attività</h2>
    <form id="nuova" novalidate>
      <div class="campi">
        <label class="campo">Titolo <input id="f-titolo" type="text" autocomplete="off"></label>
        <label class="campo">Materia <input id="f-materia" type="text" placeholder="es. Informatica" autocomplete="off"></label>
        <label class="campo">Impegno (minuti) <input id="f-minuti" type="number" min="1" step="1" inputmode="numeric"></label>
        <label class="campo">Scadenza (facoltativa) <input id="f-scadenza" type="date"></label>
        <button class="aggiungi" type="submit">Aggiungi attività</button>
      </div>
      <p id="f-msg" role="status"></p>
    </form>
  </section>

  <div id="contenuto" hidden>
    <section class="pannello riga-stat">
      <div class="anello" id="anello"><div><span><strong id="perc"></strong><br><small>completato</small></span></div></div>
      <div class="indicatori" id="indicatori"></div>
    </section>

    <section class="pannello argomenti">
      <h2>Per materia</h2>
      <div id="materie"></div>
    </section>

    <section class="pannello elenco">
      <h2 id="titolo-elenco">Attività</h2>
      <div class="strumenti">
        <div class="filtri" id="filtri">
          <button type="button" data-f="tutte" aria-pressed="true">Tutte</button>
          <button type="button" data-f="da_fare" aria-pressed="false">Da fare</button>
          <button type="button" data-f="completate" aria-pressed="false">Completate</button>
        </div>
        <input type="search" id="cerca" placeholder="Cerca titolo o materia" aria-label="Cerca">
        <select id="ordina" aria-label="Ordina per">
          <option value="file">Ordine del file</option>
          <option value="minuti">Impegno più lungo</option>
          <option value="materia">Materia (A-Z)</option>
        </select>
        <button class="scarica" id="scarica" type="button">Scarica attivita.json</button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>Attività</th><th>Materia</th><th>Minuti</th><th>Scadenza</th><th>Stato</th><th></th></tr></thead>
          <tbody id="righe"></tbody>
        </table>
      </div>
    </section>
  </div>

  <section class="pannello">
    <label class="carica" id="zona">
      <strong>Scegli o trascina qui riepilogo.json o attivita.json</strong>
      <input id="file" type="file" accept=".json,application/json">
    </label>
    <p id="messaggio" role="status"></p>
  </section>
</main>

<div id="toast" class="toast" role="status" hidden><span>Attività eliminata.</span><button id="annulla" type="button">Annulla</button></div>

<script>
// Schema dei file prodotti da Python (vedi logic.py):
//  - data/attivita.json    -> lista di { id, titolo, materia, impegno_minuti, completata, scadenza (facoltativa, AAAA-MM-GG) }
//  - output/riepilogo.json -> { attivita_totali, aperte, completate, minuti_residui,
//                               avanzamento_percentuale, attivita_aperte[], per_materia[] }
const $ = s => document.querySelector(s);
const SOGLIA = 120; // pixel di trascinamento oltre i quali si elimina

let modo = "archivio";      // "archivio" (modificabile) | "riepilogo" (sola lettura)
let attivita = [];          // archivio: tutte le attività; riepilogo: solo le aperte
let riepilogo = null;       // dati del riepilogo caricato
let fileCaricato = false;
let modificato = false;     // modifiche non ancora scaricate
let stato = "tutte", ultima = null, timer;

// ---------- Utilità ----------
function el(tag, testo, classe) {
  const e = document.createElement(tag);
  if (testo !== undefined) e.textContent = testo;
  if (classe) e.className = classe;
  return e;
}
function messaggio(testo, isErrore) {
  $("#messaggio").textContent = testo;
  $("#messaggio").className = isErrore ? "errore" : "";
}
function segnaModificato(v) {
  modificato = v;
}
const interoPositivo = v => Number.isInteger(v) && v > 0;
const testoValido = v => typeof v === "string" && v.trim() !== "";
const minutiDaTesto = t => /^\d+$/.test(t.trim()) && Number(t) > 0 ? Number(t) : null; // stesse regole di Python
const dataValida = s => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, g] = s.split("-").map(Number), d = new Date(y, m - 1, g);
  return d.getFullYear() === y && d.getMonth() === m - 1 && d.getDate() === g;
};
function oggi() { // data di oggi nel formato AAAA-MM-GG (ora locale)
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const mostraData = s => s ? s.split("-").reverse().join("/") : "—";

// ---------- Validazione (stesse regole di record_valido in logic.py) ----------
function controllaAttivita(a, n, conStato) {
  const pos = "attività n. " + n + ": ";
  if (typeof a !== "object" || a === null || Array.isArray(a)) throw new Error(pos + "non è un oggetto.");
  if (!interoPositivo(a.id)) throw new Error(pos + "«id» deve essere un intero maggiore di 0.");
  if (!testoValido(a.titolo)) throw new Error(pos + "«titolo» mancante o vuoto.");
  if (!testoValido(a.materia)) throw new Error(pos + "«materia» mancante o vuota.");
  if (!interoPositivo(a.impegno_minuti)) throw new Error(pos + "«impegno_minuti» deve essere un intero maggiore di 0.");
  if (a.scadenza !== undefined && a.scadenza !== null && a.scadenza !== "" && !(typeof a.scadenza === "string" && dataValida(a.scadenza)))
    throw new Error(pos + "«scadenza» deve essere una data nel formato AAAA-MM-GG.");
  if (conStato && typeof a.completata !== "boolean") throw new Error(pos + "«completata» deve essere true o false.");
}
function controllaIdUnici(lista) {
  const visti = new Set();
  for (const a of lista) {
    if (visti.has(a.id)) throw new Error("l'id " + a.id + " compare più di una volta.");
    visti.add(a.id);
  }
}
function verificaArchivio(lista) {
  lista.forEach((a, i) => controllaAttivita(a, i + 1, true));
  controllaIdUnici(lista);
}
function verificaRiepilogo(r) {
  for (const c of ["attivita_totali", "aperte", "completate", "minuti_residui", "avanzamento_percentuale"])
    if (typeof r[c] !== "number" || !isFinite(r[c]) || r[c] < 0) throw new Error("campo «" + c + "» mancante o non valido.");
  if (r.avanzamento_percentuale > 100) throw new Error("«avanzamento_percentuale» non può superare 100.");
  if (!Array.isArray(r.attivita_aperte)) throw new Error("manca la lista «attivita_aperte».");
  r.attivita_aperte.forEach((a, i) => controllaAttivita(a, i + 1, false));
  controllaIdUnici(r.attivita_aperte);
  if (r.per_materia !== undefined) {
    if (!Array.isArray(r.per_materia)) throw new Error("«per_materia» deve essere una lista.");
    for (const v of r.per_materia)
      if (!testoValido(v.materia) || ![v.totale, v.completate, v.minuti_residui].every(x => Number.isInteger(x) && x >= 0))
        throw new Error("una voce di «per_materia» non è valida.");
  }
}

// ---------- Indicatori ----------
function indicatore(etichetta, valore, classe) {
  const d = el("div", undefined, classe);
  d.append(el("strong", valore), el("span", etichetta));
  return d;
}
// Solo in modalità archivio: anteprima delle modifiche (il riepilogo ufficiale lo calcola Python)
function anteprima() {
  const aperte = attivita.filter(a => !a.completata);
  const tot = attivita.length, fatte = tot - aperte.length;
  const per = {};
  for (const a of attivita) {
    const v = per[a.materia] || (per[a.materia] = { materia: a.materia, totale: 0, completate: 0, minuti_residui: 0 });
    v.totale++;
    if (a.completata) v.completate++; else v.minuti_residui += a.impegno_minuti;
  }
  return {
    attivita_totali: tot, aperte: aperte.length, completate: fatte,
    minuti_residui: aperte.reduce((s, a) => s + a.impegno_minuti, 0),
    avanzamento_percentuale: tot ? Math.round(fatte / tot * 1000) / 10 : 0,
    per_materia: Object.values(per)
  };
}
function disegnaMaterie(voci) {
  const box = $("#materie");
  box.replaceChildren();
  if (voci === undefined) { box.append(el("p", "Questo riepilogo non contiene il dettaglio per materia: rigeneralo da python main.py.", "vuoto")); return; }
  if (!voci.length) { box.append(el("p", "Nessuna materia.", "vuoto")); return; }
  for (const v of voci) {
    const riga = el("div", undefined, "argomento");
    const traccia = el("div", undefined, "traccia"), riempi = el("i");
    riempi.style.width = (v.totale ? v.completate / v.totale * 100 : 0) + "%";
    traccia.append(riempi);
    riga.append(el("span", v.materia, "nome"), traccia,
      el("span", v.completate + "/" + v.totale + " · " + v.minuti_residui + " min residui", "dettaglio"));
    box.append(riga);
  }
}

// ---------- Tabella ----------
function visibili() {
  const q = $("#cerca").value.trim().toLowerCase();
  const lista = attivita.filter(a =>
    (modo === "riepilogo" || stato === "tutte" || (stato === "completate") === a.completata) &&
    (!q || (a.titolo + " " + a.materia).toLowerCase().includes(q)));
  const o = $("#ordina").value;
  if (o === "minuti") lista.sort((x, y) => y.impegno_minuti - x.impegno_minuti);
  if (o === "materia") lista.sort((x, y) => x.materia.localeCompare(y.materia, "it"));
  return lista;
}
function bottone(testo, classe, etichetta, azione) {
  const b = el("button", testo, classe);
  b.type = "button";
  b.setAttribute("aria-label", etichetta);
  b.addEventListener("click", azione);
  return b;
}
function disegnaTabella() {
  const corpo = $("#righe");
  corpo.replaceChildren();
  const lista = visibili();
  if (!lista.length) {
    const vuota = corpo.insertRow();
    vuota.className = "vuota";
    const td = vuota.insertCell();
    td.colSpan = 6; td.className = "vuoto";
    td.textContent = "Nessuna attività in questo elenco.";
    return;
  }
  for (const a of lista) {
    const fatta = modo === "archivio" && a.completata;
    const tr = corpo.insertRow();
    tr.className = fatta ? "fatta" : "";
    tr.style.setProperty("--p", fatta ? 1 : 3); // bordo verde se completata, giallo se da fare
    tr.insertCell().textContent = a.titolo;
    tr.insertCell().textContent = a.materia;
    tr.insertCell().textContent = a.impegno_minuti;
    tr.insertCell().textContent = mostraData(a.scadenza);
    const inRitardo = !a.completata && a.scadenza && a.scadenza < oggi();
    tr.insertCell().append(fatta ? el("span", "completata", "tag fatto")
      : inRitardo ? el("span", "in ritardo", "tag ritardo") : el("span", "da fare", "tag"));
    const azioni = tr.insertCell();
    azioni.className = "azioni";

    if (modo === "riepilogo") {           // sola lettura: niente azioni né trascinamento
      tr.style.cursor = "default";
      tr.style.userSelect = "auto";
      continue;
    }
    azioni.append(
      bottone(a.completata ? "Riapri" : "Completa", "modifica", (a.completata ? "Riapri " : "Completa ") + a.titolo, () => cambiaStato(a)),
      bottone("Modifica", "modifica", "Modifica " + a.titolo, () => rigaModifica(tr, a)),
      bottone("Elimina", "elimina", "Elimina " + a.titolo, () => elimina(a)));
    trascinaPerEliminare(tr, a);
  }
}

// ---------- Operazioni sull'archivio ----------
function prossimoId() { // come prossimo_id in logic.py
  return attivita.reduce((m, a) => Math.max(m, a.id), 0) + 1;
}
function cambiaStato(a) {
  a.completata = !a.completata;
  segnaModificato(true);
  aggiorna();
}
function rigaModifica(tr, a) {
  const riga = el("tr", undefined, "inModifica");
  const campo = (tipo, valore, etichetta) => {
    const i = el("input");
    i.type = tipo; i.value = valore;
    i.setAttribute("aria-label", etichetta);
    return i;
  };
  const titolo = campo("text", a.titolo, "Titolo");
  const materia = campo("text", a.materia, "Materia");
  const minuti = campo("number", a.impegno_minuti, "Impegno in minuti");
  minuti.min = 1; minuti.step = 1;
  const scadenza = campo("date", a.scadenza || "", "Scadenza");
  const sel = el("select");
  sel.setAttribute("aria-label", "Stato");
  for (const [v, t] of [["no", "da fare"], ["si", "completata"]]) {
    const o = el("option", t);
    o.value = v;
    sel.append(o);
  }
  sel.value = a.completata ? "si" : "no";
  const msg = el("span", "", "errore-riga");
  const salva = el("button", "Salva", "salva");
  const annulla = el("button", "Annulla", "annulla-modifica");
  salva.type = annulla.type = "button";
  annulla.addEventListener("click", () => riga.replaceWith(tr));
  salva.addEventListener("click", () => {
    const t = titolo.value.trim(), m = materia.value.trim(), min = minutiDaTesto(minuti.value);
    if (!t) { msg.textContent = "Il titolo non può essere vuoto."; return; }
    if (!m) { msg.textContent = "La materia non può essere vuota."; return; }
    if (min === null) { msg.textContent = "L'impegno deve essere un numero intero di minuti maggiore di 0."; return; }
    Object.assign(a, { titolo: t, materia: m, impegno_minuti: min, completata: sel.value === "si", scadenza: scadenza.value });
    segnaModificato(true);
    aggiorna();
  });
  for (const i of [titolo, materia, minuti, scadenza])
    i.addEventListener("keydown", e => {
      if (e.key === "Enter") salva.click();
      if (e.key === "Escape") annulla.click();
    });
  riga.insertCell().append(titolo);
  riga.insertCell().append(materia);
  riga.insertCell().append(minuti);
  riga.insertCell().append(scadenza);
  riga.insertCell().append(sel);
  const az = riga.insertCell();
  az.className = "azioni";
  az.append(salva, annulla, msg);
  tr.replaceWith(riga);
  titolo.focus();
}
function trascinaPerEliminare(tr, a) {
  let x0 = null;
  const ripristina = () => {
    x0 = null;
    tr.classList.remove("trascina");
    tr.style.transition = "transform .2s, opacity .2s, background .2s";
    tr.style.transform = tr.style.opacity = tr.style.background = "";
  };
  tr.addEventListener("pointerdown", e => {
    if (e.target.closest("input, button, select")) return;
    x0 = e.clientX;
    tr.setPointerCapture(e.pointerId);
    tr.classList.add("trascina");
    tr.style.transition = "none";
  });
  tr.addEventListener("pointermove", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, k = Math.min(Math.abs(dx) / SOGLIA, 1);
    tr.style.transform = "translateX(" + dx + "px)";
    tr.style.opacity = 1 - k * 0.5;
    tr.style.background = "rgba(192,57,43," + k * 0.25 + ")";
  });
  tr.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0;
    if (Math.abs(dx) < SOGLIA) return ripristina();
    x0 = null;
    tr.style.transition = "transform .2s, opacity .2s";
    tr.style.transform = "translateX(" + (dx > 0 ? 100 : -100) + "%)";
    tr.style.opacity = 0;
    setTimeout(() => elimina(a), 200);
  });
  tr.addEventListener("pointercancel", ripristina);
}
function elimina(a) {
  const i = attivita.indexOf(a);
  if (i < 0) return;
  attivita.splice(i, 1);
  ultima = { a, i };
  segnaModificato(true);
  aggiorna();
  $("#toast").hidden = false;
  clearTimeout(timer);
  timer = setTimeout(() => { $("#toast").hidden = true; ultima = null; }, 6000);
}

// ---------- Disegno generale ----------
function aggiorna() {
  const archivio = modo === "archivio";
  const r = archivio ? anteprima() : riepilogo;

  $("#sezione-nuova").hidden = !archivio;
  $("#filtri").style.display = archivio ? "" : "none";
  $("#scarica").style.display = archivio ? "" : "none";
  $("#titolo-elenco").textContent = archivio ? "Attività" : "Attività da fare";

  $("#perc").textContent = r.avanzamento_percentuale + "%";
  $("#anello").style.setProperty("--v", r.avanzamento_percentuale);
  $("#indicatori").replaceChildren(
    indicatore("totali", r.attivita_totali),
    indicatore("completate", r.completate),
    indicatore("da fare", r.aperte),
    indicatore("minuti residui", r.minuti_residui));
  disegnaMaterie(r.per_materia);

  $("#contenuto").hidden = archivio && !attivita.length && !fileCaricato;
  disegnaTabella();
}

// ---------- Caricamento file ----------
async function caricaFile(f) {
  if (!f) return;
  if (modificato && !confirm("Ci sono modifiche non scaricate. Caricare comunque un nuovo file?")) return;
  if (!/\.json$/i.test(f.name)) return messaggio("File non utilizzabile: «" + f.name + "» non è un file .json.", true);
  try {
    const testo = (await f.text()).replace(/^﻿/, ""); // ignora il BOM di PowerShell
    if (!testo.trim()) throw new Error("il file è vuoto.");
    let dati;
    try { dati = JSON.parse(testo); } catch { throw new Error("il file non contiene JSON valido."); }

    if (Array.isArray(dati)) {                                   // data/attivita.json
      verificaArchivio(dati);
      modo = "archivio";
      attivita = dati.map(a => ({ id: a.id, titolo: a.titolo.trim(), materia: a.materia.trim(),
        impegno_minuti: a.impegno_minuti, completata: a.completata, scadenza: a.scadenza || "" }));
      riepilogo = null;
      messaggio("Archivio caricato: " + f.name + " (" + attivita.length + " attività, modificabile).");
    } else if (dati && typeof dati === "object" && "attivita_aperte" in dati) { // output/riepilogo.json
      verificaRiepilogo(dati);
      modo = "riepilogo";
      riepilogo = dati;
      attivita = dati.attivita_aperte;
      messaggio("Riepilogo caricato: " + f.name + " (sola lettura).");
    } else {
      throw new Error("formato non riconosciuto: serve output/riepilogo.json oppure data/attivita.json.");
    }
    fileCaricato = true;
    segnaModificato(false);
    ultima = null; $("#toast").hidden = true;
    aggiorna();
  } catch (e) {
    messaggio("File non utilizzabile: " + e.message, true);
  }
}
$("#file").addEventListener("change", () => { caricaFile($("#file").files[0]); $("#file").value = ""; });
const zona = $("#zona");
zona.addEventListener("dragover", e => { e.preventDefault(); zona.classList.add("sopra"); });
zona.addEventListener("dragleave", () => zona.classList.remove("sopra"));
zona.addEventListener("drop", e => { e.preventDefault(); zona.classList.remove("sopra"); caricaFile(e.dataTransfer.files[0]); });

// ---------- Nuova attività (stesse regole dell'operazione 1 in Python) ----------
$("#nuova").addEventListener("submit", e => {
  e.preventDefault();
  const msg = $("#f-msg");
  const avviso = testo => { msg.textContent = testo; msg.className = "errore"; };
  const titolo = $("#f-titolo").value.trim();
  const materia = $("#f-materia").value.trim();
  const minuti = minutiDaTesto($("#f-minuti").value);
  const scadenza = $("#f-scadenza").value;
  if (!titolo) return avviso("Il titolo non può essere vuoto.");
  if (!materia) return avviso("La materia non può essere vuota.");
  if (minuti === null) return avviso("L'impegno deve essere un numero intero di minuti maggiore di 0.");
  const nuova = { id: prossimoId(), titolo, materia, impegno_minuti: minuti, completata: false, scadenza };
  attivita.push(nuova);
  for (const id of ["#f-titolo", "#f-materia", "#f-minuti", "#f-scadenza"]) $(id).value = "";
  msg.textContent = "Aggiunta «" + titolo + "» (id " + nuova.id + ").";
  msg.className = "";
  segnaModificato(true);
  aggiorna();
  $("#f-titolo").focus();
});

// ---------- Filtri, ricerca, ordinamento ----------
$("#filtri").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  stato = b.dataset.f;
  for (const x of $("#filtri").children) x.setAttribute("aria-pressed", String(x === b));
  disegnaTabella();
});
$("#cerca").addEventListener("input", disegnaTabella);
$("#ordina").addEventListener("change", disegnaTabella);
$("#annulla").addEventListener("click", () => {
  if (!ultima) return;
  attivita.splice(ultima.i, 0, ultima.a);
  ultima = null;
  $("#toast").hidden = true;
  aggiorna();
});

// ---------- Scarica: stesso formato di data/attivita.json ----------
$("#scarica").addEventListener("click", () => {
  const dati = [...attivita].sort((x, y) => x.id - y.id).map(a => {
    const o = { id: a.id, titolo: a.titolo, materia: a.materia, impegno_minuti: a.impegno_minuti, completata: a.completata };
    if (a.scadenza) o.scadenza = a.scadenza;
    return o;
  });
  const url = URL.createObjectURL(new Blob([JSON.stringify(dati, null, 2) + "\n"], { type: "application/json" }));
  const link = el("a");
  link.href = url; link.download = "attivita.json";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  segnaModificato(false);
  messaggio("Scaricato attivita.json.");
});
// ---------- Tema chiaro / scuro ----------
const sistemaScuro = matchMedia("(prefers-color-scheme: dark)");
function temaAttuale() { return document.documentElement.dataset.tema || (sistemaScuro.matches ? "scuro" : "chiaro"); }
function aggiornaBottoneTema() {
  const scuro = temaAttuale() === "scuro", b = $("#tema");
  b.textContent = scuro ? "☀ Tema chiaro" : "☾ Tema scuro";
  b.setAttribute("aria-label", scuro ? "Passa al tema chiaro" : "Passa al tema scuro");
}
$("#tema").addEventListener("click", () => {
  const nuovo = temaAttuale() === "scuro" ? "chiaro" : "scuro";
  document.documentElement.dataset.tema = nuovo;
  try { localStorage.setItem("tema", nuovo); } catch (e) {}
  aggiornaBottoneTema();
});
sistemaScuro.addEventListener("change", aggiornaBottoneTema);
aggiornaBottoneTema();

window.addEventListener("beforeunload", e => { if (modificato) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
